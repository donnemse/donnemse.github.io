<!doctype html>
<html lang="{{ page.lang | default: site.lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ page.app_name | default: site.title }}</title>
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
<header>
  <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
  {% if page.app %}
  <nav>
    <a href="{{ '/' | append: page.app | append: '/' | relative_url }}">{{ page.app_name }} 지원</a>
    <a href="{{ '/' | append: page.app | append: '/privacy/' | relative_url }}">개인정보 처리방침</a>
  </nav>
  {% endif %}
</header>
<main>
{{ content }}
</main>
<footer>
  문의: <a href="mailto:{{ site.email }}">{{ site.email }}</a>
</footer>
</body>
</html>
